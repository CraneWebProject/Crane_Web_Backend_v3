server:
  port: 8086

spring:
  application:
    name: batch-service
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false


  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            # 초기 적재 잡은 8일치 슬롯을 한 번의 호출로 생성하므로 넉넉히 잡는다.
            read-timeout: 300000
            logger-level: full

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
