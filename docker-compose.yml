version: "3.8"

# 브로커 3대 공통 설정
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.8.0
  restart: unless-stopped
  depends_on:
    - zookeeper
  deploy:
    resources:
      limits:
        memory: 1g
        cpus: "1.0"

# EXTERNAL 리스너(19092~19094)는 앱 컨테이너가 ${HOST_IP} 로 접속하는 경로라 공개가 필요하다. 외부 접근은 방화벽으로 제한한다.
# 복제 수 3, 최소 동기화 복제본 2 → 브로커 1대 장애에도 쓰기와 데이터가 유지된다 (프로듀서 기본 acks=all).
# 자동 생성되는 토픽(DLT 포함)과 내부 토픽에 모두 적용된다.
x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    # 호스트 포트를 공개하지 않는다. 브로커는 compose 내부 네트워크(zookeeper:2181)로 접속한다.
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  kafka1:
    <<: *kafka-common
    ports:
      - "19092:19092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://${HOST_IP}:19092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    ports:
      - "19093:19093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,EXTERNAL://${HOST_IP}:19093
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    ports:
      - "19094:19094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9094,EXTERNAL://${HOST_IP}:19094
    volumes:
      - kafka3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8989:8080" # 인증이 없으므로 로컬에서만 연다 (원격에서는 SSH 터널로 접속)
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka1:9092,kafka2:9093,kafka3:9094
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  zk-data:
  zk-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
